name: macOS package validation
on:
  push:
    branches: [fix/macos15-startup-signing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package universal preview
        run: RELEASE_VERSION=0.3.0-beta.2 bash scripts/build_release_dmg.sh
      - name: Core unit and integration tests
        run: >-
          xcodebuild -project SuperRClick.xcodeproj -scheme SuperRClick
          -configuration Debug -destination 'platform=macOS'
          -only-testing:SuperRClickCoreTests CODE_SIGNING_ALLOWED=NO test
      - name: Validate ad-hoc signature policy
        run: |
          APP=build/release/DerivedData/Build/Products/Release/SuperRClick.app
          # Validate the distributed copy, not Xcode's unsigned build product.
          mkdir -p /tmp/superrclick-dmg
          hdiutil attach output/release/SuperRClick-0.3.0-beta.2.dmg -mountpoint /tmp/superrclick-dmg -nobrowse -readonly
          bash scripts/verify_preview_signatures.sh /tmp/superrclick-dmg/SuperRClick.app
          hdiutil detach /tmp/superrclick-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SuperRClick-0.3.0-beta.2
          path: output/release/SuperRClick-0.3.0-beta.2.dmg*
          if-no-files-found: error
