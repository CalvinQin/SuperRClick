name: macOS package validation
on:
  push:
    branches: [fix/update-detection]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Signing policy regression tests
        run: python3 -m unittest discover -s Tests/Packaging -v
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package universal preview
        run: RELEASE_VERSION=0.3.0-beta.3 bash scripts/build_release_dmg.sh
      - name: Core unit and integration tests
        run: >-
          xcodebuild -project SuperRClick.xcodeproj -scheme SuperRClick
          -configuration Debug -destination 'platform=macOS'
          -only-testing:SuperRClickCoreTests CODE_SIGNING_ALLOWED=NO test
      - name: Validate ad-hoc signature policy
        run: |
          # Validate the distributed copy, not Xcode's unsigned build product.
          mkdir -p /tmp/superrclick-dmg
          hdiutil attach output/release/SuperRClick-0.3.0-beta.3.dmg -mountpoint /tmp/superrclick-dmg -nobrowse -readonly
          bash scripts/verify_preview_signatures.sh /tmp/superrclick-dmg/SuperRClick.app
          # Exercise dyld loading from the actual signed distribution on this runner.
          /tmp/superrclick-dmg/SuperRClick.app/Contents/MacOS/SuperRClick > /tmp/superrclick-launch.log 2>&1 &
          app_pid=$!
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat /tmp/superrclick-launch.log
            echo "Packaged app exited during startup" >&2
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
          hdiutil detach /tmp/superrclick-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SuperRClick-0.3.0-beta.3
          path: |
            output/release/SuperRClick-0.3.0-beta.3.dmg*
            output/release/SuperRClick-update.json
          if-no-files-found: error

  modern-ui:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m && xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Modern macOS UI tests (not exact 27.3 validation)
        run: >-
          xcodebuild -project SuperRClick.xcodeproj -scheme SuperRClick
          -configuration Debug -destination 'platform=macOS'
          -only-testing:SuperRClickUITests CODE_SIGNING_ALLOWED=NO
          -resultBundlePath output/ui-tests.xcresult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-macos-ui-results
          path: output/ui-tests.xcresult
